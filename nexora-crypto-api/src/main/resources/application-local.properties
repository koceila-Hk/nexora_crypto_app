# Profil de développement local : uniquement des services locaux (docker-compose.dev.yml).
# Aucun secret de prod ici, ce fichier peut être versionné.

spring.datasource.url=jdbc:mysql://localhost:3307/db_crypto_app
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.show-sql=true

# mongodb
spring.data.mongodb.uri=mongodb://localhost:27017/
spring.data.mongodb.database=coin_cache
spring.data.mongodb.auto-index-creation=true

# Clé JWT de dev uniquement, différente de la prod
security.jwt.secret-key=t8p0XC3pL1/r56CLoLPNXMLuERazPgZzvjHhGcxJKHE=
#access token : 5 minutes = 5 * 60 * 1000 = 300000 ms
security.jwt.expiration-time=300000
#Refresh token : 7 jours = 7 * 24 * 60 * 60 * 1000 = 604800000 ms
application.security.jwt.refresh-token.expiration=604800000

# Mailpit : les mails sont interceptés et visibles sur http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@nexora.local

coingecko.api.url=https://api.coingecko.com/api/v3/

frontend.url=http://localhost:4200


