spring.application.name=nexora-crypto-api

spring.profiles.default=local

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Cache des prix
spring.data.mongodb.database=coin_cache
spring.data.mongodb.auto-index-creation=true

# JWT
# Access token : 5 min / refresh token :7 jours
security.jwt.expiration-time=300000
application.security.jwt.refresh-token.expiration=604800000

# Mail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# API externe
coingecko.api.url=https://api.coingecko.com/api/v3/
