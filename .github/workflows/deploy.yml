name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version à déployer (ex. v2.0.0)
        required: true

permissions: {}

concurrency:
  group: deploy-production

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Connexion WireGuard
        env:
          WG_CONF: ${{ secrets.WG_CONF }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          printf '%s\n' "$WG_CONF" | sudo install -m 600 /dev/stdin /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Déploiement
        env:
          VERSION: ${{ inputs.version }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          ssh -p 2222 -i ~/.ssh/id_deploy -o ConnectTimeout=15 "deploy@$HOST" "$VERSION"

      - name: Fermer le tunnel
        if: always()
        run: sudo wg-quick down wg0 || true